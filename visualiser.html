<title>SDR ORF — Classroom Visualiser Audio</title>

</style></head><body>
<main id="loader"><section><h2>Opening SDR Oral Reading Fluency</h2><p>Preparing the original reading pages and classroom audio support…</p><p id="message">Text, page layout, teacher tools and reading speed are preserved.</p></section></main>
<script>
(async()=>{
  try {
    const response=await fetch('./original.html',{cache:'default'});
    if(!response.ok)throw new Error('Original ORF reader could not load ('+response.status+')');
    let source=await response.text();
    const patches=[["  let ttsQueueMode='standard';","  let ttsQueueMode='standard';\n  // Non-spoken, visual countdown with a gentle low-volume audio carrier.\n  let visualiserAudioMode=true;\n  try{visualiserAudioMode=localStorage.getItem('orf_visualiser_mode_v3')!=='off';}catch(_){}\n  const visualiserAudioButton=document.createElement('button');\n  visualiserAudioButton.type='button';\n  visualiserAudioButton.title='On: visual 3, 2, 1, NOW countdown. Off: immediate Bluetooth playback.';\n  visualiserAudioButton.style.whiteSpace='nowrap';\n  let visualiserAudioContext=null,visualiserOscillator=null,visualiserGain=null;\n  let visualiserCountdownTimer=null,visualiserCountdownId=0;\n  let visualiserCountdownActive=false,visualiserCountdownPaused=false;\n  const visualiserOverlay=document.createElement('div');\n  const visualiserNumber=document.createElement('div');\n  const visualiserCaption=document.createElement('div');\n  visualiserOverlay.id='visualiserCountdown';\n  visualiserOverlay.setAttribute('aria-hidden','true');\n  // The countdown is nonmodal and does not obscure or disable passage controls.\n  visualiserOverlay.style.cssText='position:fixed;inset:0;z-index:2147483646;display:none;place-items:start end;pointer-events:none;background:transparent';\n  const visualiserCard=document.createElement('div');\n  visualiserCard.style.cssText='display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;min-width:126px;min-height:124px;margin:16px;padding:12px 15px;border:2px solid #60a5fa;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 6px 20px #122f4d33;font-family:Arial,sans-serif;text-align:center';\n  visualiserCaption.textContent='Reading begins in';\n  visualiserCaption.style.cssText='font-size:13px;font-weight:bold;color:#17355e';\n  visualiserNumber.style.cssText='font-size:70px;font-weight:900;line-height:1;color:#2563eb';\n  visualiserCard.append(visualiserCaption,visualiserNumber);\n  visualiserOverlay.append(visualiserCard);\n  document.body.append(visualiserOverlay);\n  // Keep the countdown in the browser's fullscreen top layer as required.\n  function locateVisualiserCountdown(){\n    const root=document.fullscreenElement||document.webkitFullscreenElement||document.querySelector('#readerView.illustrated-fullscreen')||document.body;\n    if(root&&visualiserOverlay.parentNode!==root){\n      try{root.appendChild(visualiserOverlay);}catch(_){document.body.appendChild(visualiserOverlay);}\n    }\n  }\n  document.addEventListener('fullscreenchange',locateVisualiserCountdown);\n  document.addEventListener('webkitfullscreenchange',locateVisualiserCountdown);\n\n  function stopVisualiserCarrier(){\n    if(visualiserOscillator){try{visualiserOscillator.stop();}catch(_){}try{visualiserOscillator.disconnect();}catch(_){}visualiserOscillator=null;}\n    if(visualiserGain){try{visualiserGain.disconnect();}catch(_){}visualiserGain=null;}\n  }\n  function startVisualiserCarrier(){\n    if(!visualiserAudioMode||visualiserOscillator)return;\n    try{\n      const Ctx=window.AudioContext||window.webkitAudioContext;\n      if(!Ctx)return;\n      if(!visualiserAudioContext||visualiserAudioContext.state==='closed')visualiserAudioContext=new Ctx();\n      const ctx=visualiserAudioContext,osc=ctx.createOscillator(),gain=ctx.createGain();\n      osc.type='sine';osc.frequency.value=320;\n      gain.gain.setValueAtTime(0,ctx.currentTime);\n      gain.gain.linearRampToValueAtTime(0.012,ctx.currentTime+0.12);\n      osc.connect(gain);gain.connect(ctx.destination);osc.start();\n      visualiserOscillator=osc;visualiserGain=gain;\n      const p=ctx.resume();if(p&&p.catch)p.catch(()=>{});\n    }catch(_){stopVisualiserCarrier();}\n  }\n  function cancelVisualiserCountdown(){\n    visualiserCountdownId++;\n    if(visualiserCountdownTimer!==null){clearTimeout(visualiserCountdownTimer);visualiserCountdownTimer=null;}\n    visualiserCountdownActive=false;visualiserCountdownPaused=false;visualiserOverlay.style.display='none';\n  }\n  function startVisualiserCountdown(){\n    cancelVisualiserCountdown();\n    if(!visualiserAudioMode){speakNextIllustratedChunk();return;}\n    const generation=ttsGeneration,runId=visualiserCountdownId;\n    locateVisualiserCountdown();\n    visualiserCountdownActive=true;visualiserOverlay.style.display='grid';\n    if(ttsStatus)ttsStatus.textContent='Preparing classroom audio — reading starts after the visual countdown.';\n    startVisualiserCarrier();\n    const sequence=['3','2','1','NOW'];\n    let index=0;\n    function tick(){\n      if(runId!==visualiserCountdownId||generation!==ttsGeneration||!ttsPlaying)return;\n      visualiserNumber.textContent=sequence[index];\n      visualiserNumber.dataset.step=sequence[index];\n      visualiserNumber.style.fontSize=index===3?'46px':'70px';\n      visualiserNumber.style.color=index===3?'#15803d':'#2563eb';\n      visualiserCaption.textContent=index===3?'Listen carefully':'Reading begins in';\n      visualiserCountdownTimer=setTimeout(()=>{\n        visualiserCountdownTimer=null;\n        if(runId!==visualiserCountdownId||generation!==ttsGeneration||!ttsPlaying)return;\n        index++;\n        if(index<sequence.length){tick();return;}\n        cancelVisualiserCountdown();\n        // Stop the primer entirely before the real narration starts.\n        stopVisualiserCarrier();\n        if(ttsPaused){visualiserCountdownPaused=true;return;}\n        if(ttsStatus)ttsStatus.textContent='Reading the passage…';\n        speakNextIllustratedChunk();\n      },index===3?400:1000);\n    }\n    tick();\n  }\n  function refreshVisualiserAudioButton(){\n    visualiserAudioButton.setAttribute('aria-pressed',String(visualiserAudioMode));\n    visualiserAudioButton.textContent=visualiserAudioMode?'🖥 Visualiser: ON':'🖥 Visualiser: OFF';\n    visualiserAudioButton.style.background=visualiserAudioMode?'#dcfce7':'#f1f5f9';\n    visualiserAudioButton.style.color=visualiserAudioMode?'#166534':'#334155';\n    visualiserAudioButton.style.fontWeight='900';\n  }\n  visualiserAudioButton.addEventListener('click',()=>{\n    visualiserAudioMode=!visualiserAudioMode;\n    try{localStorage.setItem('orf_visualiser_mode_v3',visualiserAudioMode?'on':'off');}catch(_){}\n    if(!visualiserAudioMode){\n      if(visualiserCountdownActive||visualiserCountdownPaused){\n        const shouldRead=ttsPlaying&&!ttsPaused;\n        cancelVisualiserCountdown();stopVisualiserCarrier();\n        if(shouldRead)speakNextIllustratedChunk();\n      }else stopVisualiserCarrier();\n    }\n    // Never inject a primer if mode is enabled during an active passage.\n    refreshVisualiserAudioButton();\n  });\n  refreshVisualiserAudioButton();\n  document.querySelector('#illustratedTtsPanel .tts-controls')?.append(visualiserAudioButton);\n"],["  function stopIllustratedTts(updateMessage=true){\n    ttsGeneration+=1;","  function stopIllustratedTts(updateMessage=true){\n    ttsGeneration+=1;\n    cancelVisualiserCountdown();\n    stopVisualiserCarrier();"],["        ttsPlaying=false;\n        ttsPaused=false;\n        updateTtsButtons();\n        ttsStatus.textContent=`Finished Page ${activePage+1}.`;","        ttsPlaying=false;\n        ttsPaused=false;\n        stopVisualiserCarrier();\n        updateTtsButtons();\n        ttsStatus.textContent=`Finished Page ${activePage+1}.`;"],["      ttsPlaying=false;\n      ttsPaused=false;\n      updateTtsButtons();\n      ttsStatus.textContent='The browser could not continue reading. Press Read Page to try again.';","      ttsPlaying=false;\n      ttsPaused=false;\n      stopVisualiserCarrier();\n      updateTtsButtons();\n      ttsStatus.textContent='The browser could not continue reading. Press Read Page to try again.';"],["    ttsPaused=false;\n    updateTtsButtons();\n    speakNextIllustratedChunk();\n  }\n\n  function pauseOrResumeIllustratedTts(){","    ttsPaused=false;\n    updateTtsButtons();\n    startVisualiserCountdown();\n  }\n\n  function pauseOrResumeIllustratedTts(){"],["    if(ttsPaused){\n      ttsPaused=false;\n      if(ttsBetweenChunks){","    if(ttsPaused){\n      ttsPaused=false;\n      if(ttsBetweenChunks){"],["    }else{\n      if(ttsPauseTimer){\n        clearTimeout(ttsPauseTimer);","    }else{\n      stopVisualiserCarrier();\n      if(ttsPauseTimer){\n        clearTimeout(ttsPauseTimer);"],["  function pauseOrResumeIllustratedTts(){","  function pauseOrResumeIllustratedTts(){\n    if(visualiserCountdownActive||visualiserCountdownPaused){\n      if(visualiserCountdownActive){\n        cancelVisualiserCountdown();visualiserCountdownPaused=true;\n        ttsPaused=true;stopVisualiserCarrier();\n        if(ttsStatus)ttsStatus.textContent='Reading countdown paused.';\n      }else{\n        visualiserCountdownPaused=false;ttsPaused=false;startVisualiserCountdown();\n      }\n      updateTtsButtons();return;\n    }"],["  function restartCurrentTtsPhraseForSpeed(){","  function restartCurrentTtsPhraseForSpeed(){\n    if(visualiserCountdownActive||visualiserCountdownPaused)return;"]];
    // Reserve a side strip for full-screen annotation tools, outside the page.
    const fullscreenToolbarCss=`
  #readerView.illustrated-fullscreen{
    --orf-toolbar-gutter:110px;
    padding-top:0!important;
  }
  #readerView.illustrated-fullscreen .reader-main{
    inset:56px var(--orf-toolbar-gutter) 0 0!important;
    width:auto!important;height:auto!important;
  }
  #readerView.illustrated-fullscreen #teacherDrawTools.tdraw-tools{
    top:8px!important;right:8px!important;left:auto!important;bottom:auto!important;
    width:96px!important;max-width:96px!important;
    height:auto!important;max-height:calc(100vh - 148px)!important;
    max-height:calc(100dvh - 148px)!important;
    flex-direction:column!important;align-items:stretch!important;
    overflow-x:hidden!important;overflow-y:auto!important;
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
    overscroll-behavior:contain;
  }
  #readerView.illustrated-fullscreen #teacherDrawTools .tdraw-body{
    flex-direction:column!important;align-items:stretch!important;gap:8px!important;
    width:100%!important;height:auto!important;max-height:none!important;
    padding:6px!important;flex-shrink:0;
  }
  #readerView.illustrated-fullscreen #teacherDrawTools .tdraw-row{
    display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));
    justify-items:center;align-items:center!important;
    width:100%!important;gap:4px!important;
  }
  #readerView.illustrated-fullscreen #teacherDrawTools .tdraw-row + .tdraw-row{
    border-left:0!important;border-top:1px solid #d7dee8;
    padding:8px 0 0!important;
  }
  #readerView.illustrated-fullscreen #teacherDrawTools .tdraw-row[aria-label="Text setting"]{
    grid-template-columns:minmax(0,1fr);
  }
  #readerView.illustrated-fullscreen #teacherDrawTools .tdraw-text-input,
  #readerView.illustrated-fullscreen #teacherDrawTools .tdraw-select{
    width:100%!important;min-width:0!important;max-width:100%!important;
  }
  #readerView.illustrated-fullscreen #teacherDrawTools .tdraw-font-size-wrap{
    width:100%;padding:0!important;border:0;gap:2px;justify-content:center;
    font-size:9px;
  }
  #readerView.illustrated-fullscreen #teacherDrawTools .tdraw-font-size-quick{
    width:44px;min-width:0;
  }
  #readerView.illustrated-fullscreen #teacherDrawTools .tdraw-select,
  #readerView.illustrated-fullscreen #teacherDrawTools .tdraw-color{
    grid-column:1 / -1;
  }
  #readerView.illustrated-fullscreen #teacherDrawTools .tdraw-more-panel{
    top:auto;bottom:64px;right:var(--orf-toolbar-gutter);
    width:min(520px,calc(100vw - var(--orf-toolbar-gutter) - 8px));
    max-height:calc(100dvh - 80px);overflow-y:auto;
  }
  #readerView.illustrated-fullscreen .reader-page-nav,
  #readerView.illustrated-fullscreen .illustrated-tts-panel{
    left:calc((100% - var(--orf-toolbar-gutter)) / 2)!important;
  }
  #readerView.illustrated-fullscreen .illustrated-tts-panel{
    width:min(1180px,calc(100vw - var(--orf-toolbar-gutter) - 12px))!important;
  }
  /* A labelled countdown occupies its own corner in the reserved side strip. */
  #readerView.illustrated-fullscreen #visualiserCountdown{
    inset:auto 8px 8px auto!important;
    width:96px!important;height:116px!important;
    place-items:center!important;
  }
  #readerView.illustrated-fullscreen #visualiserCountdown > div{
    flex-direction:column!important;width:100%!important;height:100%!important;
    min-width:0!important;min-height:0!important;
    margin:0!important;padding:8px 6px!important;gap:4px!important;
    border:3px solid #2563eb!important;background:#fff!important;
  }
  #readerView.illustrated-fullscreen #visualiserCountdown > div > div:first-child{
    display:block!important;font-size:12px!important;line-height:1.15!important;
  }
  #readerView.illustrated-fullscreen #visualiserCountdown > div > div:last-child{
    font-size:54px!important;
  }
  #readerView.illustrated-fullscreen #visualiserCountdown > div > div[data-step="NOW"]{
    font-size:30px!important;
  }
`;
    if(source.split('</style>').length!==2)throw new Error('The reader styles changed; the fullscreen toolbar could not be applied safely.');
    source=source.replace('</style>',fullscreenToolbarCss+'\n</style>');
    for(let i=0;i<patches.length;i++){
      const [needle,replacement]=patches[i];
      if(source.split(needle).length!==2)throw new Error('The reading engine changed; safe patch '+(i+1)+' did not match.');
      source=source.replace(needle,replacement);
    }
    document.open();
    document.write(source);
    document.close();
  } catch(e) {
    const message=document.getElementById('message');
    if(message)message.textContent='Classroom audio mode could not load: '+String(e.message||e);
    const link=document.createElement('a');
    link.href='./original.html'+location.hash;
    link.textContent='Open the original ORF website';
    document.querySelector('section')?.append(link);
  }
})();
</script>
</body></html>
