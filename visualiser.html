<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDR ORF — Classroom Visualiser Audio</title>
<style>
body{margin:0;background:#eef3f8;font:16px/1.5 Arial,sans-serif;color:#172554}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
section{background:white;border:1px solid #dbe4f0;max-width:520px;padding:24px 32px;border-radius:18px;box-shadow:0 12px 28px #17255418}
a{color:#2563eb}h1{font-size:21px}
</style>
</head>
<body>
<main id="loader"><section><h1>Preparing SDR Reading</h1><p>Loading the illustrated texts with classroom visualiser audio protection…</p><p id="message">The reading pages and teacher tools are preserved.</p></section></main>
<script>
(async()=>{
  try{
    const response=await fetch('./index.html',{cache:'default'});
    if(!response.ok)throw new Error('Could not load the original ORF page ('+response.status+')');
    let source=await response.text();
    const patches=[["  let ttsQueueMode='standard';","  let ttsQueueMode='standard';\n  // Classroom visualiser audio can need a few seconds to wake after silence.\n  // The primer is separate from the reading passage and the WPM calibration.\n  let visualiserAudioMode=true;\n  try{visualiserAudioMode=localStorage.getItem('orf_visualiser_compat_v1')!=='off';}catch(_){}\n  const visualiserAudioButton=document.createElement('button');\n  visualiserAudioButton.type='button';\n  visualiserAudioButton.title='On: warm the classroom visualiser before reading. Off: immediate Bluetooth playback.';\n  function refreshVisualiserAudioButton(){\n    visualiserAudioButton.setAttribute('aria-pressed',String(visualiserAudioMode));\n    visualiserAudioButton.textContent=visualiserAudioMode?'🖥 Visualiser On':'🖥 Visualiser Off';\n    visualiserAudioButton.style.background=visualiserAudioMode?'#dcfce7':'';\n    visualiserAudioButton.style.color=visualiserAudioMode?'#166534':'';\n    visualiserAudioButton.style.fontWeight='900';\n  }\n  visualiserAudioButton.addEventListener('click',()=>{\n    visualiserAudioMode=!visualiserAudioMode;\n    try{localStorage.setItem('orf_visualiser_compat_v1',visualiserAudioMode?'on':'off');}catch(_){}\n    refreshVisualiserAudioButton();\n  });\n  refreshVisualiserAudioButton();\n  document.querySelector('.illustrated-tts-panel .tts-controls')?.append(visualiserAudioButton);\n  let visualiserPrimerTimer=null;\n  let visualiserPrimerActive=false;\n  function warmVisualiserBeforeReading(){\n    if(!visualiserAudioMode){speakNextIllustratedChunk();return;}\n    const generation=ttsGeneration;\n    const primer=new SpeechSynthesisUtterance('Ready to read. The page will begin now.');\n    primer.lang='en-GB';\n    if(ttsNarratorVoice)primer.voice=ttsNarratorVoice;\n    primer.rate=1;\n    primer.volume=1;\n    visualiserPrimerActive=true;\n    ttsReadPage.textContent='⏳ Preparing Audio';\n    ttsStatus.textContent='Warming the classroom audio system before reading.';\n    let completed=false;\n    function done(){\n      if(completed)return;\n      completed=true;\n      if(visualiserPrimerTimer){clearTimeout(visualiserPrimerTimer);visualiserPrimerTimer=null;}\n      visualiserPrimerActive=false;\n      ttsReadPage.textContent='▶ Read Page';\n      if(generation!==ttsGeneration||!ttsPlaying)return;\n      if(ttsPaused){ttsBetweenChunks=true;return;}\n      ttsPauseTimer=setTimeout(()=>{\n        ttsPauseTimer=null;\n        if(generation!==ttsGeneration||!ttsPlaying||ttsPaused)return;\n        ttsBetweenChunks=false;\n        speakNextIllustratedChunk();\n      },120);\n    }\n    primer.onend=done;\n    primer.onerror=done;\n    visualiserPrimerTimer=setTimeout(()=>{\n      if(generation!==ttsGeneration||!ttsPlaying)return;\n      try{illustratedSpeech.cancel();}catch(_){}\n      done();\n    },6500);\n    try{illustratedSpeech.speak(primer);}catch(_){done();}\n  }"],["  function stopIllustratedTts(updateMessage=true){\n    ttsGeneration+=1;","  function stopIllustratedTts(updateMessage=true){\n    ttsGeneration+=1;\n    if(visualiserPrimerTimer){clearTimeout(visualiserPrimerTimer);visualiserPrimerTimer=null;}\n    visualiserPrimerActive=false;\n    ttsReadPage.textContent='▶ Read Page';"],["    ttsPaused=false;\n    updateTtsButtons();\n    speakNextIllustratedChunk();\n  }\n\n  function pauseOrResumeIllustratedTts(){","    ttsPaused=false;\n    updateTtsButtons();\n    warmVisualiserBeforeReading();\n  }\n\n  function pauseOrResumeIllustratedTts(){"],["  function restartCurrentTtsPhraseForSpeed(){\n    if(!illustratedSpeech||!ttsPlaying||ttsPaused)return;","  function restartCurrentTtsPhraseForSpeed(){\n    if(visualiserPrimerActive)return;\n    if(!illustratedSpeech||!ttsPlaying||ttsPaused)return;"]];
    for(let i=0;i<patches.length;i++){
      const [before,after]=patches[i];
      if(source.split(before).length!==2)throw new Error('Reader layout changed; audio patch '+(i+1)+' could not be applied safely');
      source=source.replace(before,after);
    }
    document.open();
    document.write(source);
    document.close();
  }catch(error){
    const msg=document.getElementById('message');
    if(msg)msg.textContent='Audio compatibility page could not open: '+error.message;
    const link=document.createElement('a');
    link.href='./';
    link.textContent='Open the original ORF page';
    document.getElementById('loader')?.append(link);
  }
})();
</script>
</body>
</html>
