<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDR ORF — Classroom Visualiser Audio</title>
<style>
body{margin:0;background:#eef3f8;font:16px/1.5 Arial,sans-serif;color:#172554}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
section{background:white;border:1px solid #dbe4f0;max-width:530px;padding:24px 32px;border-radius:18px;box-shadow:0 12px 28px #17255418}
a{color:#2563eb}
</style></head><body>
<main id="loader"><section><h2>Opening SDR Oral Reading Fluency</h2><p>Preparing the original reading pages and classroom audio support…</p><p id="message">Text, page layout, teacher tools and reading speed are preserved.</p></section></main>
<script>
(async()=>{
  try {
    const response=await fetch('./index.html',{cache:'default'});
    if(!response.ok)throw new Error('Original ORF reader could not load ('+response.status+')');
    let source=await response.text();
    const patches=[["  let ttsQueueMode='standard';","  let ttsQueueMode='standard';\n  // Classroom visualiser compatibility is optional and never edits reading text.\n  // A short spoken preface in the SAME utterance allows an audio-gated classroom\n  // display to wake before the first word of the actual passage.\n  let visualiserAudioMode=true;\n  try{visualiserAudioMode=localStorage.getItem('orf_visualiser_mode_v3')!=='off';}catch(_){}\n  const visualiserAudioButton=document.createElement('button');\n  visualiserAudioButton.type='button';\n  visualiserAudioButton.title='Enable for classroom visualisers that lose the first words. Disable for immediate Bluetooth playback.';\n  visualiserAudioButton.style.whiteSpace='nowrap';\n  let visualiserAudioContext=null;\n  let visualiserOscillator=null;\n  let visualiserGain=null;\n  function stopVisualiserCarrier(){\n    if(visualiserOscillator){\n      try{visualiserOscillator.stop();}catch(_){}\n      try{visualiserOscillator.disconnect();}catch(_){}\n      visualiserOscillator=null;\n    }\n    if(visualiserGain){\n      try{visualiserGain.disconnect();}catch(_){}\n      visualiserGain=null;\n    }\n  }\n  function startVisualiserCarrier(){\n    if(!visualiserAudioMode||visualiserOscillator)return;\n    try{\n      const Ctx=window.AudioContext||window.webkitAudioContext;\n      if(!Ctx)return;\n      if(!visualiserAudioContext||visualiserAudioContext.state==='closed')visualiserAudioContext=new Ctx();\n      const ctx=visualiserAudioContext;\n      const osc=ctx.createOscillator();\n      const gain=ctx.createGain();\n      osc.type='sine';\n      osc.frequency.value=320;\n      // Quiet continuous signal prevents hardware gating between phrases.\n      gain.gain.value=0.012;\n      osc.connect(gain);\n      gain.connect(ctx.destination);\n      osc.start();\n      visualiserOscillator=osc;\n      visualiserGain=gain;\n      const p=ctx.resume();\n      if(p&&typeof p.catch==='function')p.catch(()=>{});\n    }catch(_){stopVisualiserCarrier();}\n  }\n  function refreshVisualiserAudioButton(){\n    visualiserAudioButton.setAttribute('aria-pressed',String(visualiserAudioMode));\n    visualiserAudioButton.textContent=visualiserAudioMode?'🖥 Visualiser: ON':'🖥 Visualiser: OFF';\n    visualiserAudioButton.style.background=visualiserAudioMode?'#dcfce7':'#f1f5f9';\n    visualiserAudioButton.style.color=visualiserAudioMode?'#166534':'#334155';\n    visualiserAudioButton.style.fontWeight='900';\n  }\n  visualiserAudioButton.addEventListener('click',()=>{\n    visualiserAudioMode=!visualiserAudioMode;\n    try{localStorage.setItem('orf_visualiser_mode_v3',visualiserAudioMode?'on':'off');}catch(_){}\n    if(visualiserAudioMode&&ttsPlaying&&!ttsPaused)startVisualiserCarrier();\n    else stopVisualiserCarrier();\n    refreshVisualiserAudioButton();\n  });\n  refreshVisualiserAudioButton();\n  document.querySelector('#illustratedTtsPanel .tts-controls')?.append(visualiserAudioButton);"],["  function stopIllustratedTts(updateMessage=true){\n    ttsGeneration+=1;","  function stopIllustratedTts(updateMessage=true){\n    ttsGeneration+=1;\n    stopVisualiserCarrier();"],["    const utterance=new SpeechSynthesisUtterance(cleanTextForSpeech(item.text));","    // The preface is deliberately NOT part of the actual reading text.\n    // The same utterance prevents an audio sleep/wake gap before word one.\n    const classroomFirstChunk=visualiserAudioMode&&ttsQueueIndex===0;\n    const classroomLeadIn=classroomFirstChunk\n      ?'Audio check. One, two, three, four. Get ready to listen. The reading starts now. '\n      :'';\n    const utterance=new SpeechSynthesisUtterance(classroomLeadIn+cleanTextForSpeech(item.text));"],["        learnVoiceNaturalWpm(item.role,item.text,baseRate,utteranceStartedAt,utteranceEndedAt);","        // The first chunk includes a non-reading lead-in: exclude it from\n        // speed calibration so the actual passage WPM remains meaningful.\n        if(!classroomFirstChunk)learnVoiceNaturalWpm(item.role,item.text,baseRate,utteranceStartedAt,utteranceEndedAt);"],["        ttsPlaying=false;\n        ttsPaused=false;\n        updateTtsButtons();\n        ttsStatus.textContent=`Finished Page ${activePage+1}.`;","        ttsPlaying=false;\n        ttsPaused=false;\n        stopVisualiserCarrier();\n        updateTtsButtons();\n        ttsStatus.textContent=`Finished Page ${activePage+1}.`;"],["      ttsPlaying=false;\n      ttsPaused=false;\n      updateTtsButtons();\n      ttsStatus.textContent='The browser could not continue reading. Press Read Page to try again.';","      ttsPlaying=false;\n      ttsPaused=false;\n      stopVisualiserCarrier();\n      updateTtsButtons();\n      ttsStatus.textContent='The browser could not continue reading. Press Read Page to try again.';"],["    ttsPaused=false;\n    updateTtsButtons();\n    speakNextIllustratedChunk();\n  }\n\n  function pauseOrResumeIllustratedTts(){","    ttsPaused=false;\n    updateTtsButtons();\n    startVisualiserCarrier();\n    speakNextIllustratedChunk();\n  }\n\n  function pauseOrResumeIllustratedTts(){"],["    if(ttsPaused){\n      ttsPaused=false;\n      if(ttsBetweenChunks){","    if(ttsPaused){\n      ttsPaused=false;\n      startVisualiserCarrier();\n      if(ttsBetweenChunks){"],["    }else{\n      if(ttsPauseTimer){\n        clearTimeout(ttsPauseTimer);","    }else{\n      stopVisualiserCarrier();\n      if(ttsPauseTimer){\n        clearTimeout(ttsPauseTimer);"]];
    for(let i=0;i<patches.length;i++){
      const [needle,replacement]=patches[i];
      if(source.split(needle).length!==2)throw new Error('The reading engine changed; safe patch '+(i+1)+' did not match.');
      source=source.replace(needle,replacement);
    }
    document.open();
    document.write(source);
    document.close();
  } catch(e) {
    const message=document.getElementById('message');
    if(message)message.textContent='Classroom audio mode could not load: '+String(e.message||e);
    const link=document.createElement('a');
    link.href='./index.html'+location.hash;
    link.textContent='Open the original ORF website';
    document.querySelector('section')?.append(link);
  }
})();
</script>
</body></html>
