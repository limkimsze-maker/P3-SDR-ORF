<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDR ORF — Classroom Visualiser Audio</title>
<style>
body{margin:0;background:#eef3f8;font:16px/1.5 Arial,sans-serif;color:#172554}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
section{background:white;border:1px solid #dbe4f0;max-width:520px;padding:24px 32px;border-radius:18px;box-shadow:0 12px 28px #17255418}
a{color:#2563eb}
</style>
</head>
<body>
<main id="loader"><section><h2>Opening SDR Oral Reading Fluency</h2><p>Loading the original pages with classroom visualiser sound protection…</p><p id="message">The original reading tools are preserved. Visualiser mode plays an audio check before the passage; switch it off for Bluetooth.</p></section></main>
<script>
(async()=>{
  try {
    const response=await fetch('./index.html',{cache:'default'});
    if(!response.ok)throw new Error('Original reader could not be loaded ('+response.status+')');
    let source=await response.text();
    const patches=[["  let ttsQueueMode='standard';","\n  let ttsQueueMode='standard';\n  // Visualiser audio often sleeps after silence and loses the first few words.\n  // Use a brief spoken lead-in within the SAME utterance as the first text.\n  // Unlike a separate warm-up utterance, there is no silent handoff to gate.\n  let visualiserAudioMode=true;\n  try { visualiserAudioMode=localStorage.getItem('orf_visualiser_mode_v2')!=='off'; } catch (_) {}\n  const visualiserAudioButton=document.createElement('button');\n  visualiserAudioButton.type='button';\n  visualiserAudioButton.title='On for classroom visualiser: warm the audio before the first text word. Off for Bluetooth speaker.';\n  function refreshVisualiserAudioButton(){\n    visualiserAudioButton.setAttribute('aria-pressed',String(visualiserAudioMode));\n    visualiserAudioButton.textContent=visualiserAudioMode?'🖥 Visualiser On':'🖥 Visualiser Off';\n    visualiserAudioButton.style.background=visualiserAudioMode?'#dcfce7':'';\n    visualiserAudioButton.style.color=visualiserAudioMode?'#166534':'';\n    visualiserAudioButton.style.fontWeight='900';\n  }\n  visualiserAudioButton.addEventListener('click',()=>{\n    visualiserAudioMode=!visualiserAudioMode;\n    try { localStorage.setItem('orf_visualiser_mode_v2', visualiserAudioMode?'on':'off'); } catch (_) {}\n    refreshVisualiserAudioButton();\n  });\n  refreshVisualiserAudioButton();\n  document.querySelector('.illustrated-tts-panel .tts-controls')?.append(visualiserAudioButton);\n"],["    const utterance=new SpeechSynthesisUtterance(cleanTextForSpeech(item.text));","\n    // A speaking primer and the passage share one utterance, so the classroom\n    // audio gate has opened before the first actual word of the page.\n    // Wake the visualiser audio gate before the actual reading words.\n    // This is ONE speech utterance, avoiding a silence at hand-off.\n    const isClassroomOpening=visualiserAudioMode && ttsQueueIndex===0;\n    const classroomLeadIn=isClassroomOpening\n      ? 'Audio check. One, two, three, four. Listen carefully. Reading begins. '\n      : '';\n    const spokenText=classroomLeadIn + cleanTextForSpeech(item.text);\n    const utterance=new SpeechSynthesisUtterance(spokenText);"],["        learnVoiceNaturalWpm(item.role,item.text,baseRate,utteranceStartedAt,utteranceEndedAt);","        // Exclude audio warm-up from voice timing/calibration.\n        if(!isClassroomOpening){\n          learnVoiceNaturalWpm(item.role,item.text,baseRate,utteranceStartedAt,utteranceEndedAt);\n        }"]];
    for(let i=0;i<patches.length;i++){
      const [needle,replacement]=patches[i];
      if(source.split(needle).length!==2){
        throw new Error('Reader code changed, patch '+(i+1)+' could not be applied safely');
      }
      source=source.replace(needle,replacement);
    }
    document.open();
    document.write(source);
    document.close();
  } catch(err) {
    const message=document.getElementById('message');
    if(message)message.textContent='Could not activate classroom audio mode: '+String(err.message||err);
    const link=document.createElement('a');
    link.href='./';
    link.textContent='Open standard ORF';
    document.getElementById('loader')?.append(link);
  }
})();
</script>
</body>
</html>
