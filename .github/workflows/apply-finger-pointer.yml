name: Apply Finger pointer

on:
  push:
    paths:
      - '.github/workflows/apply-finger-pointer.yml'

permissions:
  contents: write

jobs:
  apply-finger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch exact live index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'{label} anchor not found')
              s=s.replace(old,new,1)

          old='''  .draw-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;touch-action:none}\n  .scroll-hint{max-width:900px;margin:0 auto 22px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 15px;text-align:center;color:#475569;font-weight:700;box-shadow:0 8px 20px rgba(15,23,42,.07)}\n'''
          new='''  .draw-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;touch-action:none}\n  body.tdraw-finger-mode,body.tdraw-finger-mode *{cursor:none!important}\n  #tdrawFingerPointer{\n    position:fixed;z-index:2600;display:none;width:clamp(48px,8vw,82px);height:clamp(62px,10vw,102px);\n    transform:translate(-50%,calc(-100% - 10px));align-items:flex-start;justify-content:center;\n    font-size:clamp(3rem,7vw,5.2rem);line-height:1;filter:drop-shadow(0 4px 3px rgba(16,37,63,.22));\n    pointer-events:none;user-select:none;-webkit-user-select:none\n  }\n  .scroll-hint{max-width:900px;margin:0 auto 22px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 15px;text-align:center;color:#475569;font-weight:700;box-shadow:0 8px 20px rgba(15,23,42,.07)}\n'''
          once(old,new,'CSS')

          old='''          <button class="tdraw-btn active" type="button" data-tdraw-tool="pointer" title="Pointer / scroll (default)" aria-label="Pointer and scroll">\n            <svg class="tdraw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l12 10-6.2 1.1L8 20z" fill="#fff" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>\n          </button>\n'''
          new=old+'''          <button class="tdraw-btn" type="button" data-tdraw-tool="finger" title="Finger pointer — click again to turn off" aria-label="Finger pointer">\n            <span aria-hidden="true" style="font-size:22px;line-height:1">☝️</span>\n          </button>\n'''
          once(old,new,'button')

          once('''</div>\n<div id="toast" class="toast" role="status"></div>\n\n<script>\n''','''</div>\n<div id="tdrawFingerPointer" aria-hidden="true">☝️</div>\n<div id="toast" class="toast" role="status"></div>\n\n<script>\n''','overlay')

          once("""  const editTextBtn=$('#tdrawEditText'),fitTextBtn=$('#tdrawFitText');\n  const autoHeightBtn=$('#tdrawAutoHeight'),deleteTextBtn=$('#tdrawDeleteText');\n""","""  const editTextBtn=$('#tdrawEditText'),fitTextBtn=$('#tdrawFitText');\n  const autoHeightBtn=$('#tdrawAutoHeight'),deleteTextBtn=$('#tdrawDeleteText');\n  const fingerPointer=$('#tdrawFingerPointer');\n""",'finger const')

          once("""  const TOOL_CURSOR_NAMES={\n    pen:'Pen',highlighter:'Highlighter',eraser:'Eraser',boxErase:'Select & Erase',\n    line:'Line',arrow:'Arrow',rect:'Box',ellipse:'Circle',\n    text:'Text Box',pointer:'Pointer'\n  };\n""","""  const TOOL_CURSOR_NAMES={\n    pen:'Pen',highlighter:'Highlighter',eraser:'Eraser',boxErase:'Select & Erase',\n    line:'Line',arrow:'Arrow',rect:'Box',ellipse:'Circle',\n    text:'Text Box',pointer:'Pointer',finger:'Finger'\n  };\n""",'tool names')

          once("""  function allDrawingCanvases(){return $$('.draw-canvas')}\n""","""  function hideFingerPointer(){\n    if(fingerPointer)fingerPointer.style.display='none';\n  }\n\n  function placeFingerPointer(clientX,clientY){\n    if(!fingerPointer||drawState.tool!=='finger')return;\n    fingerPointer.style.display='flex';\n    const fingerHeight=fingerPointer.getBoundingClientRect().height||82;\n    fingerPointer.style.left=`${clientX}px`;\n    fingerPointer.style.top=`${Math.max(fingerHeight+10,clientY+fingerHeight+10)}px`;\n  }\n\n  document.addEventListener('pointermove',event=>{\n    if(drawState.tool==='finger')placeFingerPointer(event.clientX,event.clientY);\n  });\n\n  function allDrawingCanvases(){return $$('.draw-canvas')}\n""",'finger helpers')

          once("""    const localState={\n      drawing:false,current:null,panning:false,\n      panStartX:0,panStartY:0,startPanX:0,startPanY:0,\n      textAction:null\n    };\n""","""    const localState={\n      drawing:false,current:null,panning:false,fingering:false,\n      panStartX:0,panStartY:0,startPanX:0,startPanY:0,\n      textAction:null\n    };\n""",'local state')

          once("""      const point=normPoint(canvas,event);\n\n      if(drawState.tool==='boxErase'){\n""","""      const point=normPoint(canvas,event);\n\n      if(drawState.tool==='finger'){\n        event.preventDefault();\n        canvas.setPointerCapture?.(event.pointerId);\n        clearSelectedText(canvas);\n        localState.fingering=true;\n        placeFingerPointer(event.clientX,event.clientY);\n        return;\n      }\n\n      if(drawState.tool==='boxErase'){\n""",'finger down')

          once("""    canvas.addEventListener('pointermove',event=>{\n      if(localState.textAction){\n""","""    canvas.addEventListener('pointermove',event=>{\n      if(drawState.tool==='finger'){\n        if(event.pointerType==='mouse'||localState.fingering){\n          event.preventDefault();\n          placeFingerPointer(event.clientX,event.clientY);\n        }\n        return;\n      }\n\n      if(localState.textAction){\n""",'finger move')

          once("""    function finishDrawing(event){\n      if(localState.textAction){\n""","""    function finishDrawing(event){\n      if(localState.fingering){\n        event?.preventDefault();\n        localState.fingering=false;\n        if(event&&canvas.hasPointerCapture?.(event.pointerId)){\n          canvas.releasePointerCapture?.(event.pointerId);\n        }\n        return;\n      }\n\n      if(localState.textAction){\n""",'finger finish')

          once("""  function updateButtons(){\n    if(!activeDrawingCanvas&&currentDoc)activeDrawingCanvas=canvasFor(activePage);\n\n    undoBtn.disabled=commandsFor().length===0;\n""","""  function updateButtons(){\n    if(!activeDrawingCanvas&&currentDoc)activeDrawingCanvas=canvasFor(activePage);\n\n    const fingerActive=drawState.tool==='finger';\n    document.body.classList.toggle('tdraw-finger-mode',fingerActive);\n    if(!fingerActive)hideFingerPointer();\n\n    undoBtn.disabled=commandsFor().length===0;\n""",'button update')

          once("""      canvas.style.cursor=\n        drawState.tool==='text'?'text':(TOOL_CURSORS[drawState.tool]||'crosshair');\n""","""      canvas.style.cursor=\n        drawState.tool==='finger'?'none':\n          (drawState.tool==='text'?'text':(TOOL_CURSORS[drawState.tool]||'crosshair'));\n""",'canvas cursor')

          once("""  $$('.tdraw-btn[data-tdraw-tool]').forEach(button=>{\n    button.addEventListener('click',()=>{\n      drawState.tool=button.dataset.tdrawTool;\n      updateButtons();\n    });\n  });\n""","""  $$('.tdraw-btn[data-tdraw-tool]').forEach(button=>{\n    button.addEventListener('click',()=>{\n      const nextTool=button.dataset.tdrawTool;\n      drawState.tool=nextTool==='finger'&&drawState.tool==='finger'?'pointer':nextTool;\n      updateButtons();\n    });\n  });\n""",'finger toggle')

          p.write_text(s,encoding='utf-8',newline='')
          PY
      - name: Verify and publish
        shell: bash
        run: |
          grep -q 'data-tdraw-tool="finger"' index.html
          grep -q "nextTool==='finger'&&drawState.tool==='finger'?'pointer':nextTool" index.html
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add Finger pointer tool'
          git push
